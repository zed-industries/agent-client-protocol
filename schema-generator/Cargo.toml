[package]
name = "schema-generator"
version = "0.0.0"
edition = "2024"
publish = false
license = "Apache-2.0"
description = "Internal generator for Agent Client Protocol JSON Schema artifacts"
repository = "https://github.com/agentclientprotocol/agent-client-protocol"

[lints]
workspace = true

[features]
unstable = ["agent-client-protocol-schema/unstable"]
unstable_protocol_v2 = ["agent-client-protocol-schema/unstable_protocol_v2"]
unstable_session_inject = [
    "unstable_protocol_v2",
    "agent-client-protocol-schema/unstable_session_inject",
]

[dependencies]
agent-client-protocol-schema = { workspace = true, features = ["schemars"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
